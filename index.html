<!doctype html>
<html lang="pt-BR" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DomiMais: dominó com blefe em que o verso de cada peça mostra a soma dos dois lados. Deduza, blefe e vença." />
  <meta name="theme-color" content="#12141C" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <title>DomiMais</title>
  <script>
    // Aplica o tema salvo antes de a página aparecer, para não piscar.
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem('domimais:theme') === 'light' ? 'light' : 'dark';
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
