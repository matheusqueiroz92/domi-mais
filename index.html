<!doctype html>
<html lang="pt-BR" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <!-- Ícone da aba: a marca da logo (dominó, "+" e cérebro), sem o nome. -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DomiMais: dominó com blefe em que o verso de cada peça mostra a soma dos dois lados. Deduza, blefe e vença." />
  <meta name="theme-color" content="#111724" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>DomiMais</title>
  <script>
    // Aplica o tema salvo antes de a página aparecer, para não piscar.
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem('domimais:theme') === 'light' ? 'light' : 'dark';
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
